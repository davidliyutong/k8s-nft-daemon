name: Publish Docker image

on:
  # ── Manual trigger ──────────────────────────────────────────────────────────
  # Run from Actions → "Publish Docker image" → "Run workflow".
  # Optionally supply an extra tag (e.g. "v1.0.0-rc1"); "latest" is always pushed.
  workflow_dispatch:
    inputs:
      extra_tag:
        description: 'Extra image tag to push in addition to "latest" (e.g. v1.0.0-rc1). Leave blank to push only "latest".'
        required: false
        default: ''

  # ── Release trigger ─────────────────────────────────────────────────────────
  # Fires when a GitHub Release is published (not draft, not pre-release).
  # Tags pushed: semver variants (1.2.3, 1.2) + latest.
  release:
    types: [published]

env:
  IMAGE: ghcr.io/davidliyutong/k8s-nft-daemonset

jobs:
  # ── Stage 1: build one image per platform ────────────────────────────────────
  # Each platform runs on a native amd64 GitHub-hosted runner; non-amd64
  # platforms are cross-compiled via QEMU.  Building in parallel jobs is faster
  # than emulating all platforms sequentially in a single job.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sanitise platform string for use as a cache/artifact key
      # e.g. "linux/arm/v7" → "linux-arm-v7"
      - name: Derive platform slug
        id: slug
        run: echo "value=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # Build for the single platform and push a per-platform image digest.
      # The digest is stored as an artifact for the merge job below.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.slug.outputs.value }}
          cache-to: type=gha,scope=${{ steps.slug.outputs.value }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.slug.outputs.value }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Stage 2: merge per-platform digests into a multi-arch manifest ────────────
  merge:
    name: Merge manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download all digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Tag strategy ────────────────────────────────────────────────────────
      # release:            v1.2.3 → 1.2.3, 1.2, latest
      # workflow_dispatch:  always latest; extra_tag when provided
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=${{ github.event.inputs.extra_tag }},enable=${{ github.event.inputs.extra_tag != '' }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
